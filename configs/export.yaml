# How photos and their metadata are stored in MongoDB.
# Adjust the field paths to match your schema (dot notation for nested fields).
#
# atpg.photos.files schema (confirmed by a read-only survey, 2026-09-22; see
# docs/PHASE0_REMAINING.md §1): metadata is flattened onto the GridFS file
# document itself, so source is "gridfs" and there is no separate metadata
# collection to join. There is no visit_id, rep_id, city, or created_at on the
# photo -- region comes from a location join instead (§3, not wired up yet).
mongo:
  uri_env: MONGO_URI        # env var holding the connection string
  database: atpg
  gridfs_bucket: photos     # -> collections photos.files / photos.chunks

metadata:
  # Where the store / visit / date info lives:
  #   "collection" -> a separate collection whose documents reference the GridFS file id
  #   "gridfs"     -> inside the fs.files document itself (fields below are
  #                   then top-level paths on that document, e.g. "store_code")
  source: gridfs
  fields:                   # manifest column -> path in the metadata document
    store_id: store_code    # str OR int in Mongo; export.py normalises to a
                             # trimmed string (0 stores use both types, so this
                             # never merges two different stores)
    taken_at: uploadDate
    # visit_id, rep_id, city: intentionally unmapped, they do not exist on
    # this document. Do not invent paths for them.
  query: {}                 # optional extra Mongo filter, e.g. {"deleted": false}

export:
  out_dir: data/raw
  batch_size: 200           # docs per cursor batch
  throttle_seconds: 0.05    # pause between files, protects the live DB during work hours
  date_from: null           # "2026-01-01" to limit by taken_at
  date_to: null
