# Active scope: the slice of the full taxonomy being labeled and reported now.
#
# The full picture stays in classes.csv (every product and competitor type) and
# reporting.yaml (every category the business has named). This file only
# narrows what labelers are asked to name and what gets reported. Widening it
# is a config edit, and nothing already labeled changes: boxes outside the
# scope keep the label `product` ("not identified yet") and get named when a
# later scope reaches them. A box with no label at all counts as `product`.
#
# Pilot, decided 2026-09-27: per category (cans, glass, reported separately),
# for two brands. Every can and glass bottle of ours is still named, whichever
# brand (a can of another brand of ours is ours, not a competitor); `brands`
# only limits whose share is reported.
#
# Metric narrowed 2026-09-29: share = ours / (ours + targeted competitors).
# This is our share AGAINST THE RIVALS WE TRACK, not our share of all cans:
# untargeted brands (Coca-Cola, Bear, ...) are in neither side, so they may
# stay `product`. Never report this number as "share of shelf" unqualified.
#
# Extensibility check: adding a brand, a category, or a competitor name must only
# ever touch this file, classes.csv, reporting.yaml, and gallery images. If it
# needs a code change or a relabel, the design failed; record where
# (docs/PILOT.md step 8).

brands: [Kix-Max, TorshX]
categories: [canned_drinks, glass_drinks]

# Targeted competitors, by `brand` in classes.csv (rows `<brand>_<pack_type>`,
# is_ours=0, source=manual). Their labels come after `product` and have no
# number key, so keys 1-7 never move. Decided 2026-09-29.
competitors:
  - Icy-Monkey     # ایسی مانکی   cans + glass
  - Hoffenberg     # هوفنبرگ      cans + glass
  - Laimon-Fresh   # لایمون فرش   cans (glass retired, see below)
  - Fizzio         # فیزیو        glass
  - Freshy-Day     # فرش دی       glass
  - Genius         # جنیوس        glass
  - Sunich-Cool    # سن ایچ کول   glass

# Labels no longer tracked (2026-10-04: marketing dropped Laimon-Fresh glass as
# unrelated). The brand stays tracked for its other pack types. Boxes already
# labeled this way (the frozen v1 export is never edited) are read as grey
# `product`: in neither side of the share. Labelers are no longer offered the
# label and no gallery folder is made for it. The classes.csv row stays so old
# exports keep parsing.
retired: [Laimon-Fresh_glass]

# Which denominator is the headline share (shelf-eval reports both):
#   targeted  ours / (ours + the competitors above)   <- the pilot's number
#   all       ours / every named face in the category (ours, tracked and
#             untracked competitors). Only meaningful once untracked cans and
#             glass are labeled COMPETITOR_<pack_type> instead of left grey.
# Adding a tracked competitor (e.g. Coca-Cola): a classes.csv row per pack type
# (`Coca-Cola_canned,Coca-Cola,canned,,0,manual`), a line above, the label in
# the Label Studio config, and a rename pass over COMPETITOR_* boxes. No code.
share_against: targeted

# How finely our products are named: `sku` (Kix-Max_canned_blue-berry) or
# `brand` (Kix-Max_canned). The pilot needs brand only, decided 2026-09-27:
# share of shelf per category doesn't depend on the flavour. `brand` labels are
# the prefix of the sku labels, so switching to `sku` later refines them.
detail: brand
