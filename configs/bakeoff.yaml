# Settings for `shelf-bakeoff` (src/face_counter/training/detector_bakeoff.py).
#
# Every run copies the values it actually used into runs/bakeoff/<stamp>/run_args.json,
# so a run can always be traced back to its prompts even after this file changes.

yoloe:
  # Text prompts for the open-vocabulary candidate (yoloe-26s). Each detected box
  # is assigned the ONE prompt it matches best, and its confidence is how well it
  # matches that phrase, so the prompts compete with each other.
  #
  # Rules:
  # - Generic packaging words only, never brand or SKU names: stage 1 only has to
  #   find products; naming them is the gallery's job.
  # - A single ambiguous word can fail silently. The 2026-09-26 run labeled 0 of
  #   1,466 boxes "can" (the word is also a verb) and 1,370 "bottle".
  # - More specific is NOT better. The 2026-09-27 run with only
  #   [aluminum drink can, glass bottle, plastic bottle] found 98 boxes in total
  #   across 30 photos (median 2.5 per photo, 0 on 12 photos), and lost bottles the
  #   generic list had found. YOLOE is shelved as the detector; revisit only for
  #   the can-vs-glass decision on crops (docs/PILOT.md step 5).
  #
  # Try a wording on the GPU box without editing this file:
  #   uv run shelf-bakeoff --models yoloe-26s --yoloe-prompts "aluminum drink can,glass bottle"
  #
  # These are the prompts the 2026-09-26 run used; change them deliberately.
  prompts:
    - can
    - bottle
    - carton
    - juice box
    - jar
    - box
    - packet
    - candy bag
    - product package

yolo26l-sku110k:
  # YOLO26l trained on SKU-110K (0.906 mAP50 on SKU-110K val). Its weights are not
  # a scriptable download: open the page below, press "Download model" (.pt), and
  # save the file at `weights` (relative to the repo root). *.pt is gitignored, so
  # the file never enters git; carry it to the GPU box with scp and compare sha256s.
  # Page: https://platform.ultralytics.com/fatih-enterprise/yolo26-sku-detection/yolo26l-sku-detector-sku-110k
  # Needs ultralytics>=8.4.156.
  weights: models/yolo26l-sku110k.pt
  # `uv run python scripts/export_onnx.py weights onnx` once, offline (needs the
  # `analytics` group); `serving.onnx_detector` runs this file at request time,
  # never ultralytics itself (T6 plan, 2026-10-10). *.onnx is gitignored too.
  onnx: models/yolo26l-sku110k.onnx
