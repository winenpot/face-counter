[project]
name = "face-counter"
version = "0.1.0"
description = "Counts visible product faces on retail shelf photos and computes share of shelf"
readme = "README.md"
authors = [
    { name = "Vincent Law", email = "winenpot@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pillow>=12.3.0",
    "pillow-heif>=0.18",
    "pymongo>=4.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
face-counter = "face_counter:main"
shelf-export = "face_counter.training.export_photos:main"
shelf-splits = "face_counter.label_studio.make_splits:main"
shelf-label-prep = "face_counter.label_studio.prepare_label_studio:main"
shelf-ls-setup = "face_counter.label_studio.setup_project:main"
shelf-bakeoff = "face_counter.training.detector_bakeoff:main"
shelf-eval = "face_counter.evaluation.cli:main"
shelf-match = "face_counter.identification.cli:main"
shelf-serve = "face_counter.serving.app:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mongomock>=4.1",
    "pytest>=8.0",
    "ruff>=0.16.8",
]
analytics = [
    # GPU-training group: hemin owns this. torch/torchvision deliberately
    # unpinned (no index override) so uv resolves plain PyPI wheels — the
    # CUDA-bundled build hemin's GPU needs. NEVER pin these to a CPU index
    # here: this file + uv.lock are shared with hemin via git, and a CPU
    # pin here would silently replace hemin's working CUDA torch on its
    # next `uv sync`. This laptop needs this group only for two numeric
    # tests in test_identification.py (bare `torch`, no transformers) —
    # install a CPU-only torch directly into THIS machine's .venv instead:
    #   uv pip install torch --index https://download.pytorch.org/whl/cpu \
    #       --python .venv/bin/python
    # then always `uv sync --inexact` locally so it isn't stripped back out.
    "notebook>=7.6.2",
    "torch>=2.14",
    "torchvision>=0.29",
    "transformers>=4.50",
    "ultralytics>=8.3",
]
serve = [
    "fastapi>=0.115",
    "onnxruntime>=1.18",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
